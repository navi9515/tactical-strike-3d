<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Slither Arena - Clean Multiplayer Snake</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- LOBBY SCREEN -->
  <div id="lobby-screen" class="overlay-screen active">
    <div class="lobby-card">
      <div class="logo-container">
        <h1 class="game-title">SUPER SLITHER <span>ARENA</span></h1>
        <p class="game-subtitle">LIGHTWEIGHT REAL-TIME MULTIPLAYER</p>
      </div>

      <div class="input-group">
        <label for="player-name-input">ENTER CALLSIGN</label>
        <input type="text" id="player-name-input" placeholder="Enter Callsign..." maxlength="15" value="Slither">
      </div>

      <div class="color-select-container">
        <label>SELECT SNAKE COLOR</label>
        <div class="color-grid">
          <button class="color-btn active" data-color="#00f0ff" style="background: #00f0ff;"></button>
          <button class="color-btn" data-color="#ff0055" style="background: #ff0055;"></button>
          <button class="color-btn" data-color="#f59e0b" style="background: #f59e0b;"></button>
          <button class="color-btn" data-color="#10b981" style="background: #10b981;"></button>
          <button class="color-btn" data-color="#a855f7" style="background: #a855f7;"></button>
          <button class="color-btn" data-color="#ec4899" style="background: #ec4899;"></button>
        </div>
      </div>

      <button id="btn-join" class="btn-primary">PLAY SLITHER</button>

      <div class="controls-guide">
        <h3>CONTROLS</h3>
        <div class="controls-grid">
          <div><kbd>MOUSE</kbd> Move Mouse to Steer</div>
          <div><kbd>LEFT CLICK</kbd> Hold to Speed Boost</div>
          <div><kbd>SPACEBAR</kbd> Alternative Speed Boost</div>
          <div><kbd>T</kbd> Chat Box</div>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME CANVAS -->
  <canvas id="game-canvas"></canvas>

  <!-- HUD OVERLAY -->
  <div id="hud-overlay" class="hud-hidden">
    <!-- Top Right: Score & Length -->
    <div class="score-card">
      <div class="score-label">SCORE</div>
      <div id="score-val" class="score-num">10</div>
      <div class="length-label">LENGTH: <span id="length-val">15</span></div>
    </div>

    <!-- Top Left: Leaderboard -->
    <div class="leaderboard-box">
      <div class="lb-title">TOP SLITHERS</div>
      <div id="lb-list"></div>
    </div>

    <!-- Top Center: Online & Kill Feed -->
    <div class="top-center-hud">
      <div id="match-status">ONLINE</div>
      <div id="kill-feed"></div>
    </div>

    <!-- Bottom Left: Minimap & Chat -->
    <div class="bottom-left-hud">
      <div class="radar-box">
        <canvas id="radar-canvas" width="110" height="110"></canvas>
      </div>

      <div id="chat-container">
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Press Enter to chat..." maxlength="80">
      </div>
    </div>
  </div>

  <!-- RESPAWN SCREEN -->
  <div id="respawn-screen" class="overlay-screen hidden">
    <div class="respawn-card">
      <h2 class="killed-by-title">YOU DIED!</h2>
      <p id="killed-by-text">You hit another snake!</p>
      <div class="respawn-timer-container">
        <button id="btn-respawn" class="btn-primary" style="margin-top: 15px;">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/audio.js"></script>
  <script src="js/network.js"></script>
  <script src="js/slitherEngine.js"></script>
</body>
</html>
